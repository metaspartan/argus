<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#06070b">
<title>Argus</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="top">
    <a class="brand" href="#/" aria-label="Argus home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--cpu)"/><stop offset="1" stop-color="var(--mem)"/></linearGradient></defs><path d="M2.5 16C6 9.5 10.6 6.5 16 6.5S26 9.5 29.5 16C26 22.5 21.4 25.5 16 25.5S6 22.5 2.5 16Z" fill="none" stroke="url(#bg)" stroke-width="2.6" stroke-linejoin="round"/><circle cx="16" cy="16" r="5.6" fill="url(#bg)"/><circle cx="17.8" cy="14.2" r="1.7" fill="#fff" opacity=".85"/></svg>
      <span>argus</span>
    </a>
    <div class="summary" id="summary"></div>
    <div class="top-actions">
      <span class="live off" id="live" title="Live connection"><i></i><span>Connecting</span></span>
      <label class="search" id="searchBox"><span id="searchIc"></span><input id="q" placeholder="Filter machines…" autocomplete="off" aria-label="Filter machines"></label>
      <button class="btn icon ghost" id="viewToggle" title="Grid / list" aria-label="Toggle grid or list view"></button>
      <button class="btn primary label-hide" id="addBtn"><span id="addIc"></span><span>Add machine</span></button>
      <button class="btn icon ghost" id="logoutBtn" title="Sign out" aria-label="Sign out"></button>
    </div>
  </header>
  <main id="main"></main>
</div>
<div id="modal" class="modal" hidden></div>
<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
